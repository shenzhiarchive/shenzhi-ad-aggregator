buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['AdAggregator_' + name]
  }

  repositories {
    google()
    mavenCentral()
    maven { url 'https://artifact.bytedance.com/repository/pangle' }

  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"

  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["AdAggregator_" + name]).toInteger()
}

android {
  namespace "com.shenzhi.adaggregator"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    // AdMob App ID占位符默认值（测试App ID）
    // 应用可以在自己的build.gradle中通过manifestPlaceholders覆盖此值
    manifestPlaceholders = [
      ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"
    ]
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
  // 穿山甲 SDK Maven 仓库
  maven { url 'https://artifact.bytedance.com/repository/pangle' }
  
  // 本地 AAR 文件仓库 - flatDir 不会递归，需要分别指定每个目录
  flatDir {
    dirs 'libs'
  }
  flatDir {
    dirs 'libs/adn'
  }
  flatDir {
    dirs 'libs/adapter'
  }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation 'com.squareup.okhttp3:okhttp:3.12.1'


  implementation("com.google.android.gms:play-services-ads:17.2.0") {
      exclude group: 'com.android.support'
  }
  
  // ADN SDKs (从 libs/adn 目录加载)
  implementation(name: "Baidu_MobAds_SDK_v9.423", ext: 'aar')
  implementation(name: "GDTSDK.unionNormal.4.660.1530", ext: 'aar')
  implementation(name: "kssdk-ad-4.9.20.1", ext: 'aar')
  implementation(name: "windAd-4.24.7", ext: 'aar')
  implementation(name: "windAd-common-1.8.6", ext: 'aar')
  
  // Mediation Adapters (从 libs/adapter 目录加载)
  implementation(name: "mediation_admob_adapter_17.2.0.71", ext: 'aar')
  implementation(name: "mediation_baidu_adapter_9.423.2", ext: 'aar')
  implementation(name: "mediation_gdt_adapter_4.660.1530.2", ext: 'aar')
  implementation(name: "mediation_ks_adapter_4.9.20.1.2", ext: 'aar')
  implementation(name: "mediation_sigmob_adapter_4.24.7.2", ext: 'aar')

  // JAR 文件和其他 AAR 文件
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation(name: 'circleimageview-2.2.0', ext: 'aar')
  implementation(name: 'LayoutManagerGroup', ext: 'aar')
  implementation(name: 'open_ad_sdk', ext: 'aar')
  
  androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
      exclude group: 'com.android.support', module: 'support-annotations'
  })
  implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
  implementation 'com.squareup.okhttp3:okhttp:3.12.1'
  implementation "com.android.support:appcompat-v7:28.0.0"
  implementation "com.android.support:support-annotations:28.0.0"
  implementation "com.android.support:support-v4:28.0.0"
  implementation "com.squareup.leakcanary:leakcanary-android-no-op:1.5.4"
  implementation "com.android.support:recyclerview-v7:28.0.0"
  implementation 'com.android.support:multidex:1.0.3'
  implementation 'com.android.support.constraint:constraint-layout:2.0.4'

  //测试工具
  debugImplementation(name: 'tools-release', ext: 'aar')

  implementation "com.google.code.gson:gson:2.8.5"
  implementation "com.bytedance.ies.ugc.aweme:opensdk-china-external:0.1.8.0"
  implementation "com.bytedance.ies.ugc.aweme:opensdk-common:0.1.8.0"
}
